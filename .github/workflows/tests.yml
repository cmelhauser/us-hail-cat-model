name: CI

on:
  push:
    branches:
      - main
      - "v*"
  pull_request:
    branches:
      - main
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes-dev \
            libgeos-dev \
            libproj-dev \
            proj-bin \
            libhdf5-dev \
            libnetcdf-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check (py_compile)
        run: python -m py_compile run_pipeline.py scripts/*.py

      - name: Policy / documentation consistency
        run: python scripts/check_policy_consistency.py

      - name: Unit tests (100% scripts + run_pipeline)
        env:
          OPENBLAS_NUM_THREADS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q tests \
            -m "not integration and not regression and not slow" \
            -p pytest_cov \
            --cov=scripts \
            --cov=run_pipeline \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=100

      - name: Ruff
        run: ruff check .

      - name: Dry run
        run: python run_pipeline.py --dry-run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: test
    # Only run on main pushes, not every PR; integration is slow.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes-dev libgeos-dev libproj-dev proj-bin \
            libhdf5-dev libnetcdf-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Integration tests
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          pytest -q tests -m "integration" --timeout=300

  aws:
    name: AWS adapter (100% coverage + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node.js (CDK jsii)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AWS + lint deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[aws,dev]"

      - name: Ruff (aws package)
        run: ruff check aws

      - name: AWS unit + laptop E2E (100% hail_aws gate)
        env:
          OPENBLAS_NUM_THREADS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          PYTHONPATH=aws pytest -q aws/tests \
            -m "not localstack" \
            --ignore=aws/tests/test_cdk_stack.py \
            -p pytest_cov \
            --cov=hail_aws --cov=run_pipeline_aws \
            --cov-report=term-missing \
            --cov-fail-under=100

      - name: CDK synth tests
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          PYTHONPATH=aws:aws/cdk pytest -q aws/tests/test_cdk_stack.py -m 'not localstack'
