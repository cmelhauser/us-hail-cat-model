# CONUS Hail Cat Model — AWS Fargate pipeline parameters
# Used by CDK deploy and run_pipeline_aws.py (single source of truth).

project:
  name: us-hail-cat-model
  version: "2.3.0"
  environment: dev
  region: us-east-1
  tags:
    Project: us-hail-cat-model
    Component: hail-pipeline
    Environment: dev

image:
  repository_name: hail-cat-model
  tag: "2.3.0"

network:
  # null = CDK creates a VPC with public subnets (no NAT; lower cost).
  # Set vpc_id + subnet_ids to import an existing VPC instead.
  vpc_id: null
  subnet_ids: []
  assign_public_ip: true
  max_azs: 2

storage:
  efs_encrypted: true
  data_mount: /app/data
  logs_mount: /app/logs
  figures_mount: /app/docs/figures

ecs:
  cluster_name: hail-pipeline
  log_group: /ecs/hail-pipeline
  log_retention_days: 30
  # Family-level cancel (01/02). GridRad day tasks use gridrad_fanout.cancel_day_*.
  cancel_siblings_on_failure: true

secrets:
  # ARNs filled after Secrets Manager secrets exist (or leave null for dry-run).
  cdsapi_secret_arn: null
  ncar_rda_secret_arn: null

tasks:
  download_myrorss:
    family: hail-download-myrorss
    stage: "01"
    cpu: 4096
    memory: 16384
    ephemeral_storage_gib: 100
    command: ["run_pipeline.py", "--only", "01"]

  download_mrms:
    family: hail-download-mrms
    stage: "02"
    cpu: 4096
    memory: 16384
    ephemeral_storage_gib: 100
    command: ["run_pipeline.py", "--only", "02"]

  # One convective day per task when workflow.gridrad_fanout.enabled.
  # Staging (~8–12 GiB/day) is on EFS, not ephemeral. Prefer 16 GiB RAM;
  # 8192 MiB is experimental (smoke-test a severe day before fleet use).
  download_gridrad:
    family: hail-download-gridrad
    stage: "04c"
    cpu: 2048
    memory: 16384
    ephemeral_storage_gib: 50
    # Default command when fan-out is disabled; fan-out overrides per day.
    command:
      - "scripts/04c_fill_gridrad_gap.py"
      - "--with-04b-download"
      - "--workers"
      - "1"

  finalize:
    family: hail-finalize
    cpu: 8192
    memory: 32768
    ephemeral_storage_gib: 200
    # 04b skipped: GridRad download is embedded in 04c (same as local run_pipeline).
    command: ["run_pipeline.py", "--from", "03", "--skip", "04b"]

workflow:
  parallel_downloads:
    - download_myrorss
    - download_mrms
    - download_gridrad
  finalize_task: finalize
  poll_seconds: 60
  stop_timeout_seconds: 120
  # One Fargate task per GridRad convective day (2012-01-01 → 2020-10-13).
  # Cap concurrency for NCAR/GDEX (~≤10 streams/account) and EFS staging.
  gridrad_fanout:
    enabled: true
    task: download_gridrad
    max_concurrent: 10
    from_date: null
    until_date: null
    missing_only: true
    with_04b_download: true
    workers: 1
    download_workers: 1
    cancel_day_siblings_on_failure: false
    post_manifest_rebuild: true
    container_name: hail
