services:
  localstack:
    # Community image: ECS/ECR/EFS are license-gated (Pro) as of LocalStack 4.x.
    # Keep this compose file for STS/IAM/CFN/S3 smoke probes. Laptop orchestrator
    # E2E for downloads-only / full uses stub ECS in
    # aws/tests/test_laptop_orchestrator_e2e.py (LocalStack Community lacks ECS).
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ecs,ecr,efs,iam,logs,s3,sts,cloudformation,ssm,secretsmanager,ec2
      - DEBUG=0
      - PERSISTENCE=0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
